<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Parallel World - AI-Powered Simulation Platform" />
    <title>Parallel World</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Bitcount Single Ink from Fontshare -->
    <link href="https://api.fontshare.com/v2/css?f[]=bitcount-single-ink@400&display=swap" rel="stylesheet">
    <!-- Theme flash prevention -->
    <script>
      (function() {
        var t = localStorage.getItem('pw-theme');
        if (t) { document.documentElement.setAttribute('data-theme', t); }
        else { document.documentElement.setAttribute('data-theme', 'dark'); }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
