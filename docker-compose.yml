services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mirofish-postgres
    environment:
      POSTGRES_DB: mirofish
      POSTGRES_USER: mirofish
      POSTGRES_PASSWORD: mirofish_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirofish"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mirofish:
    image: ghcr.io/666ghj/mirofish:latest
    # 加速镜像（如拉取缓慢可替换上方地址）
    # image: ghcr.nju.edu.cn/666ghj/mirofish:latest
    container_name: mirofish
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: