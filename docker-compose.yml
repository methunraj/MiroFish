services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: parallelworld-postgres
    environment:
      POSTGRES_DB: parallelworld
      POSTGRES_USER: parallelworld
      POSTGRES_PASSWORD: parallelworld_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallelworld"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  parallelworld:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parallelworld
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: